<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>faro de luz</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x480ca8);





// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

//GridHelper
     var gridHelper = new THREE.GridHelper (200,200);
scene.add(gridHelper);
//ejes
var axesHelper = new THREE.AxesHelper(50);
scene.add(axesHelper);
    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;


//  💫💢🐭🐭 LUCES
//materiales

var light1 = new THREE.AmbientLight(0xffffff,2);
scene.add(light1);



//OBJETOS  ✏️✏️✏️✏️  🪶
// POSTE VERTICAL
var geometry01f = new THREE.BoxGeometry(0.5, 3, 0.5);
var material01f = new THREE.MeshLambertMaterial({color: 0x495057});
var mesh01f = new THREE.Mesh(geometry01f, material01f);
mesh01f.position.set(0, 1.5, 0);
scene.add(mesh01f);

// BASE DEL POSTE
var geometry02f = new THREE.BoxGeometry(0.7, 0.5, 0.7);
var material02f = new THREE.MeshLambertMaterial({color: 0x343A40});
var mesh02f = new THREE.Mesh(geometry02f, material02f);
mesh02f.position.set(0, 0.25, 0);
scene.add(mesh02f);

// BRAZO CURVO SUPERIOR
var geometry03f = new THREE.TorusGeometry(0.9, 0.12, 12, 32, Math.PI);
var material03f = new THREE.MeshLambertMaterial({color: 0x495057});
var mesh03f = new THREE.Mesh(geometry03f, material03f);
mesh03f.position.set(0.9, 3, 0);
mesh03f.rotation.set(0, 0, Math.PI/8);
scene.add(mesh03f);

//  BRAZO  DEL POSTE
var geometry04f = new THREE.CylinderGeometry(0.12, 0.12, 0.5, 12);
var material04f = new THREE.MeshLambertMaterial({color: 0x495057});
var mesh04f = new THREE.Mesh(geometry04f, material04f);
mesh04f.position.set(0.85, 3.8, 0);
scene.add(mesh04f);

// medio circulo gris fuerte superior de la luz
var geometry05f = new THREE.SphereGeometry(0.6, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
var material05f = new THREE.MeshLambertMaterial({color: 0x343a40});
var mesh05f = new THREE.Mesh(geometry05f, material05f);
mesh05f.position.set(1.6, 3.5, 0);
mesh05f.rotation.x = 0;
scene.add(mesh05f);

// FOCO AMARILLO
var geometry06f = new THREE.SphereGeometry(0.30, 16, 12);
var material06f = new THREE.MeshLambertMaterial({color: 0Xfcbf49});
var mesh06f = new THREE.Mesh(geometry06f, material06f);
mesh06f.position.set(1.6, 3.5, 0);
scene.add(mesh06f);

//plano
var geometry01 = new THREE.PlaneGeometry(200,200);
var material01 = new THREE.MeshLambertMaterial({
color:0xffafcc,
side: THREE.DoubleSide
});

var mesh01 = new THREE.Mesh(geometry01,material01);
scene.add(mesh01);
mesh01.position.set(2,0,2);
mesh01.rotation.set(-Math.PI/2,0,0);



//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
